name: Always Alive AI Shorts Bot

on:
  schedule:
    - cron: '*/5 * * * *'   # Har 5 min mein Telegram topic check + Always Alive
    - cron: '30 2 * * *'    # Roz Subah 8:00 AM IST (Motivation Stage Girl)
    - cron: '30 13 * * *'   # Roz Shaam 7:00 PM IST (Trending News Documentary)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select Mode (motivation or news_documentary)'
        required: true
        default: 'motivation'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ "${{ github.event.schedule }}" == "30 2 * * *" ]; then
            python main.py motivation
          elif [ "${{ github.event.schedule }}" == "30 13 * * *" ]; then
            python main.py news_documentary
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python main.py "${{ github.event.inputs.mode }}"
          else
            python main.py telegram_check
          fi
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add history.txt tg_state.txt
          git commit -m "Sync bot state" || exit 0
          git push
